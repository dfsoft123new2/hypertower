<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>箭塔 · 绝对纪 HYPERTOWER VI</title>




<style>
:root {
  --paper: #E8EDF1; --paper-2: #F5F7F9; --paper-3: #DCE3E9;
  --rule: rgba(16, 52, 90, .07); --rule-2: rgba(16, 52, 90, .22); --rule-3: rgba(16, 52, 90, .45);
  --ink: #10345A; --ink-2: #44678B; --ink-3: #7690AA;
  --e1: #A06A00; --e2: #0A7A63; --e3: #5242C4; --e4: #B12A5B; --e5: #7E6200;
  --good: #0A7A63; --bad: #B12A5B;
  --acc: var(--e1);
  --num: "STIX Two Text", "STIX Two Math", "Cambria Math", "Times New Roman", serif;
  --ui: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans CJK SC", "Source Han Sans SC", system-ui, sans-serif;
  color-scheme: light;
  box-sizing: border-box; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #0C2B4D; --paper-2: #10355C; --paper-3: #0A2442;
    --rule: rgba(200, 225, 255, .075); --rule-2: rgba(200, 225, 255, .2); --rule-3: rgba(200, 225, 255, .42);
    --ink: #EAF2FB; --ink-2: #A3BFDA; --ink-3: #7192B3;
    --e1: #F4BA45; --e2: #63D8BE; --e3: #B6A8FF; --e4: #FF8AAA; --e5: #FFE58C;
    --good: #63D8BE; --bad: #FF8AAA; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #0C2B4D; --paper-2: #10355C; --paper-3: #0A2442;
  --rule: rgba(200, 225, 255, .075); --rule-2: rgba(200, 225, 255, .2); --rule-3: rgba(200, 225, 255, .42);
  --ink: #EAF2FB; --ink-2: #A3BFDA; --ink-3: #7192B3;
  --e1: #F4BA45; --e2: #63D8BE; --e3: #B6A8FF; --e4: #FF8AAA; --e5: #FFE58C;
  --good: #63D8BE; --bad: #FF8AAA; color-scheme: dark;
}
html { scroll-padding-top: env(safe-area-inset-top, 0px); }
*, *::before, *::after { box-sizing: border-box; }
body {
  margin: 0; min-height: 100vh; color: var(--ink); font: 15px/1.55 var(--ui);
  background-color: var(--paper);
  background-image:
    linear-gradient(var(--rule) 1px, transparent 1px), linear-gradient(90deg, var(--rule) 1px, transparent 1px),
    linear-gradient(var(--rule) 1px, transparent 1px), linear-gradient(90deg, var(--rule) 1px, transparent 1px);
  background-size: 120px 120px, 120px 120px, 24px 24px, 24px 24px;
  -webkit-font-smoothing: antialiased;
}
body[data-era="1"] { --acc: var(--e1); } body[data-era="2"] { --acc: var(--e2); } body[data-era="3"] { --acc: var(--e3); }
body[data-era="4"] { --acc: var(--e4); } body[data-era="5"] { --acc: var(--e5); }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--paper); }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--acc); outline-offset: 2px; }
.num { font-family: var(--num); font-variant-numeric: lining-nums tabular-nums; }
.muted { color: var(--ink-2); } .faint { color: var(--ink-3); }
.wrap { max-width: 1320px; margin: 0 auto; padding: 0 20px; }

/* header */
.top { display: flex; align-items: center; gap: 18px; padding: 14px 0 6px; flex-wrap: wrap; }
.logo { display: flex; align-items: baseline; gap: 10px; }
.logo b { font: 900 30px/1 "Noto Serif SC", "Songti SC", serif; letter-spacing: .04em; }
.logo i { font: italic 15px var(--num); color: var(--ink-2); letter-spacing: .02em; }
.rail { display: flex; align-items: center; gap: 0; margin-left: auto; }
.rail .st { display: flex; align-items: center; gap: 6px; font-size: 13px; color: var(--ink-3); padding: 2px 0; }
.rail .st .dot { width: 22px; height: 22px; border: 1px solid var(--rule-3); display: grid; place-items: center; font: 600 11px var(--num); border-radius: 50%; }
.rail .st.done .dot { background: var(--rule-2); color: var(--ink); }
.rail .st.now { color: var(--ink); } .rail .st.now .dot { border-color: var(--acc); background: var(--acc); color: var(--paper); }
.rail .ln { width: 22px; height: 1px; background: var(--rule-3); margin: 0 6px; }
.rail .st .nm { display: inline; }
.save-ind { font-size: 12px; color: var(--ink-3); min-width: 4em; text-align: right; }

/* hero */
.hero { display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: 28px; padding: 18px 0 22px; border-bottom: 1px solid var(--rule-2); align-items: end; }
.hero-l { min-width: 0; }
.hero-cap { font-size: 13px; color: var(--ink-2); margin-bottom: 4px; }
.hero-num { font-family: var(--num); font-weight: 600; font-size: clamp(46px, 8.6vw, 112px); line-height: 1.02; letter-spacing: -.01em; white-space: nowrap; overflow: hidden; text-overflow: clip; padding-top: .45em; }
.hero-num sup { font-size: .5em; vertical-align: .95em; line-height: 0; font-weight: 600; letter-spacing: 0; }
.hero-num .x { font-weight: 400; color: var(--ink-2); margin: 0 .12em; font-size: .7em; vertical-align: .08em; }
.hero-num .arr { color: var(--acc); font-weight: 400; margin: 0 .06em; letter-spacing: -.12em; padding-right: .12em; }
.hero-num .arr sup { color: var(--acc); font-size: .42em; vertical-align: 1.3em; }
.hero-num .unit { font-size: .38em; color: var(--acc); margin-left: .15em; vertical-align: .9em; }
.hero-read { font-size: 13.5px; color: var(--ink-2); margin-top: 6px; min-height: 1.5em; }
.hero-rate { font-family: var(--num); font-size: 18px; margin-top: 2px; }
.hero-rule { height: 2px; background: var(--acc); transform-origin: left; transform: scaleX(0); margin-top: 8px; }
.hero-rule.go { animation: draw 1.4s cubic-bezier(.2, .7, .2, 1) forwards; }
@keyframes draw { 0% { transform: scaleX(0); opacity: 1; } 70% { transform: scaleX(1); opacity: 1; } 100% { transform: scaleX(1); opacity: 0; } }
.ledger { display: grid; gap: 2px; font-size: 13.5px; }
.ledger .row { display: flex; justify-content: space-between; gap: 10px; border-bottom: 1px dotted var(--rule-2); padding: 3px 0; }
.ledger .row .v { font-family: var(--num); font-size: 15px; text-align: right; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.goal { margin-top: 10px; font-size: 12.5px; color: var(--ink-2); }
.goal .bar { height: 6px; border: 1px solid var(--rule-3); margin-top: 4px; position: relative; overflow: hidden; }
.goal .bar i { position: absolute; inset: 0 auto 0 0; background: var(--acc); width: 0; transition: width .4s; }

/* banner */
.banner { margin: 14px 0 0; padding: 8px 12px; border: 1px dashed var(--acc); display: flex; gap: 12px; align-items: center; flex-wrap: wrap; font-size: 14px; }
.banner[hidden] { display: none; }

/* main */
.main { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 28px; padding: 22px 0 120px; align-items: start; }
.tabs { display: flex; gap: 2px; flex-wrap: wrap; border-bottom: 1px solid var(--rule-2); margin-bottom: 16px; }
.tab { background: none; border: 0; padding: 8px 12px 9px; color: var(--ink-2); cursor: pointer; font-size: 14.5px; position: relative; }
.tab:hover { color: var(--ink); }
.tab.on { color: var(--ink); }
.tab.on::after { content: ""; position: absolute; left: 8px; right: 8px; bottom: -1px; height: 2px; background: var(--acc); }
.tab .new { display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: var(--acc); margin-left: 4px; vertical-align: 2px; }
.tab.mob { display: none; }
.side { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 12px); }

/* drafting frame */
.frame { border: 1px solid var(--rule-2); position: relative; padding: 18px 16px 14px; background: color-mix(in srgb, var(--paper) 80%, transparent); }
.frame + .frame { margin-top: 22px; }
.frame > .ft { position: absolute; top: -.75em; left: 12px; background: var(--paper); padding: 0 8px; font-size: 13px; color: var(--ink-2); }
.frame > .fr { position: absolute; top: -.75em; right: 12px; background: var(--paper); padding: 0 8px; font-size: 12.5px; color: var(--ink-3); }
.p { margin: 0 0 10px; color: var(--ink-2); font-size: 14px; max-width: 64ch; }

/* buttons */
.btn { background: transparent; border: 1px solid var(--rule-3); padding: 6px 11px; cursor: pointer; border-radius: 2px; line-height: 1.3; text-align: center; white-space: nowrap; }
.btn:hover { border-color: var(--acc); }
.btn.buy { min-width: 116px; font-family: var(--num); font-size: 14px; }
.btn.buy[aria-disabled="true"], .btn.gate[aria-disabled="true"] { opacity: .45; cursor: default; }
.btn.buy.can { border-color: var(--acc); background: color-mix(in srgb, var(--acc) 15%, transparent); }
.btn.solid { background: var(--acc); color: var(--paper); border-color: var(--acc); }
.btn.sm { padding: 3px 8px; font-size: 13px; }
.btn.ghost { border-style: dashed; }
.row-btns { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.tog { display: inline-flex; align-items: center; gap: 6px; font-size: 13.5px; cursor: pointer; user-select: none; color: var(--ink-2); }
.tog input { accent-color: var(--acc); width: 15px; height: 15px; }
input.txt, textarea.txt, select.txt { font: 13px var(--num); background: var(--paper-2); color: var(--ink); border: 1px solid var(--rule-3); padding: 5px 7px; border-radius: 2px; }
textarea.txt { width: 100%; min-height: 90px; resize: vertical; word-break: break-all; }

/* parts table (bill of materials) */
.bom { width: 100%; border-collapse: collapse; font-size: 14px; }
.bom th { text-align: left; font-weight: 400; color: var(--ink-3); font-size: 12.5px; border-bottom: 1px solid var(--rule-3); padding: 4px 6px; }
.bom td { border-bottom: 1px solid var(--rule-2); padding: 8px 6px; vertical-align: middle; }
.bom td.nm { white-space: nowrap; }
.bom td.ds { color: var(--ink-2); font-size: 13px; }
.bom td.lv { font-family: var(--num); color: var(--ink-2); white-space: nowrap; text-align: right; }
.bom td.r { text-align: right; }
.bom td.amt { font-family: var(--num); font-size: 16px; white-space: nowrap; }
.bom tr.off td { opacity: .45; }
.tblwrap { overflow-x: auto; }

/* lattice */
.lat { display: grid; gap: 0; justify-content: start; user-select: none; margin: 4px 0 6px; }
.lat .c { display: grid; place-items: center; }
.lat .n { width: var(--cn); height: var(--cn); border: 1px solid var(--rule-3); font: 600 calc(var(--cn) * .5)/1 var(--num); cursor: pointer; background: var(--paper-2); position: relative; padding: 0; color: var(--ink); }
.lat .n:hover { border-color: var(--acc); }
.lat .n.sel { outline: 2px solid var(--acc); outline-offset: 1px; }
.lat .n.lam { background: color-mix(in srgb, var(--acc) 20%, var(--paper-2)); border-color: var(--acc); font-size: calc(var(--cn) * .26); }
.lat .n.lam .lsym { position: absolute; top: 2px; left: 4px; font: italic 600 calc(var(--cn) * .24)/1 var(--num); color: var(--acc); }
.lat .n .dg { position: absolute; bottom: 2px; right: 4px; font: 400 calc(var(--cn) * .2)/1 var(--num); color: var(--ink-3); }
.lat .o { width: var(--co); height: var(--co); border: 0; background: none; cursor: pointer; font: 400 calc(var(--co) * .62)/1 var(--num); color: var(--ink-3); padding: 0; }
.lat .o.h { width: var(--co); height: var(--cn); } .lat .o.v { width: var(--cn); height: var(--co); }
.lat .o.set { color: var(--acc); font-weight: 600; }
.lat .o:hover { background: color-mix(in srgb, var(--acc) 12%, transparent); }
.lat .k { width: var(--co); height: var(--co); background: repeating-linear-gradient(45deg, var(--rule-2) 0 1px, transparent 1px 5px); }
.lat .lv { font: 12px var(--num); color: var(--ink-2); padding: 0 0 0 8px; white-space: nowrap; justify-items: start; max-width: 96px; overflow: hidden; text-overflow: ellipsis; }
.lat .lv.b { padding: 6px 0 0; justify-items: center; writing-mode: horizontal-tb; max-width: var(--cn); font-size: 11px; }
.inv { display: flex; flex-wrap: wrap; gap: 6px; margin: 10px 0; }
.inv .chip { border: 1px solid var(--rule-3); padding: 2px 8px; font: 14px var(--num); }
.inv .chip b { font-weight: 600; color: var(--acc); margin-right: 4px; }
.lat-sum { display: flex; flex-wrap: wrap; gap: 6px 18px; font-size: 13.5px; color: var(--ink-2); margin-bottom: 6px; }
.lat-sum .num { color: var(--ink); font-size: 15px; }
.prec { font-size: 12.5px; color: var(--ink-3); margin: 8px 0 0; max-width: 60ch; }
.locked { border: 1px dashed var(--rule-3); padding: 28px 18px; color: var(--ink-3); font-size: 14px; text-align: center; }

/* popover */
.pop { position: absolute; z-index: 40; background: var(--paper-2); border: 1px solid var(--rule-3); box-shadow: 0 10px 30px rgba(0, 0, 0, .25); padding: 10px; min-width: 200px; max-width: 280px; font-size: 13.5px; }
.pop[hidden] { display: none; }
.pop h4 { margin: 0 0 6px; font-size: 14px; font-weight: 600; }
.pop .opt { display: flex; width: 100%; justify-content: space-between; gap: 12px; background: none; border: 1px solid transparent; padding: 5px 7px; cursor: pointer; text-align: left; }
.pop .opt:hover { border-color: var(--acc); }
.pop .opt[disabled] { opacity: .4; cursor: default; }
.pop .opt .sym { font: 600 16px var(--num); color: var(--acc); min-width: 2.2em; }
.pop .opt.cur { background: color-mix(in srgb, var(--acc) 14%, transparent); }
.pop .btn { width: 100%; margin-top: 6px; }

/* engines */
.eng-amt { font-family: var(--num); font-size: 16px; }
.eng-m { font-family: var(--num); color: var(--ink-2); font-size: 13px; }

/* star map */
.smap { width: 100%; height: auto; display: block; border: 1px solid var(--rule-2); background: radial-gradient(ellipse at 50% 100%, color-mix(in srgb, var(--acc) 10%, transparent), transparent 70%); }
.smap .edge { stroke: var(--rule-3); stroke-width: .35; }
.smap .edge.on { stroke: var(--acc); stroke-width: .5; }
.smap .node circle { fill: var(--paper-2); stroke: var(--rule-3); stroke-width: .4; cursor: pointer; }
.smap .node.can circle { stroke: var(--acc); stroke-width: .8; stroke-dasharray: 1 .6; }
.smap .node.own circle { fill: var(--acc); stroke: var(--acc); }
.smap .node.lock { opacity: .35; }
.smap .node.sel circle { stroke: var(--ink); stroke-width: .9; }
.smap .node text { font: 2.3px var(--ui); fill: var(--ink-2); text-anchor: middle; pointer-events: none; }
.smap .node.own text { fill: var(--ink); }
.sdetail { display: grid; grid-template-columns: 1fr auto; gap: 10px; align-items: center; margin-top: 12px; min-height: 54px; }
.sdetail h4 { margin: 0; font-size: 15px; }

/* paradox */
.pips { display: inline-flex; gap: 3px; vertical-align: middle; }
.pips i { width: 9px; height: 9px; border: 1px solid var(--acc); transform: rotate(45deg); display: inline-block; margin: 0 2px; }
.pips i.f { background: var(--acc); }

/* spire */
.spire { display: grid; grid-template-columns: 150px minmax(0, 1fr); gap: 18px; }
.tower { display: flex; flex-direction: column-reverse; align-items: center; gap: 2px; padding-top: 6px; }
.tower .fl { height: 11px; border: 1px solid var(--rule-3); }
.tower .fl.b { background: var(--acc); border-color: var(--acc); }
.tower .fl.nx { border-color: var(--acc); border-style: dashed; }
.flist { max-height: 300px; overflow-y: auto; font-size: 13.5px; }
.flist div { padding: 4px 0; border-bottom: 1px dotted var(--rule-2); display: flex; gap: 10px; }
.flist div .i { font-family: var(--num); color: var(--ink-3); min-width: 2em; }

/* arrows */
.atrack { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 6px; margin: 4px 0 14px; }
.atrack .a { border: 1px solid var(--rule-3); text-align: center; padding: 8px 2px; }
.atrack .a .s { font: 600 20px var(--num); }
.atrack .a .c { font: 12px var(--num); color: var(--ink-3); }
.atrack .a.own { border-color: var(--acc); background: color-mix(in srgb, var(--acc) 16%, transparent); }
.atrack .a.nx { border-style: dashed; border-color: var(--acc); }

/* achievements */
.ach { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 6px; }
.ach .t { border: 1px solid var(--rule-2); padding: 8px 6px; min-height: 64px; font-size: 12.5px; color: var(--ink-3); }
.ach .t b { display: block; font-weight: 600; font-size: 13px; color: var(--ink-2); margin-bottom: 2px; }
.ach .t.got { border-color: var(--acc); color: var(--ink-2); }
.ach .t.got b { color: var(--ink); }

/* dock */
.dock { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; background: color-mix(in srgb, var(--paper) 92%, transparent); backdrop-filter: blur(6px); border-top: 1px solid var(--rule-2); padding-bottom: env(safe-area-inset-bottom, 0px); }
.dock .wrap { display: flex; gap: 10px; padding-top: 10px; padding-bottom: 10px; overflow-x: auto; }
.gate { flex: 1 1 0; min-width: 150px; text-align: left; padding: 8px 12px; border: 1px solid var(--rule-3); background: transparent; cursor: pointer; position: relative; border-radius: 2px; }
.gate .g1 { font-size: 14px; display: flex; justify-content: space-between; gap: 8px; }
.gate .g2 { font: 600 16px var(--num); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.gate .g3 { font-size: 11.5px; color: var(--ink-3); }
.gate.can { border-color: var(--acc); background: color-mix(in srgb, var(--acc) 14%, transparent); }
.gate .cry { position: absolute; left: 0; bottom: 0; height: 2px; background: var(--acc); width: 0; }
.gate[hidden], .dock[hidden] { display: none; }

/* modal + toast */
.modal { position: fixed; inset: 0; z-index: 60; display: grid; place-items: center; background: rgba(4, 18, 34, .55); padding: 20px; }
.modal[hidden] { display: none; }
.modal .box { background: var(--paper); border: 1px solid var(--rule-3); max-width: 560px; width: 100%; padding: 26px 24px 20px; position: relative; max-height: 86vh; overflow-y: auto; }
.modal .box h3 { margin: 0 0 4px; font: 600 22px var(--ui); }
.modal .box .era-mark { font: italic 15px var(--num); color: var(--acc); margin-bottom: 10px; }
.modal .box p { color: var(--ink-2); margin: 0 0 10px; max-width: 60ch; }
.modal .box .act { display: flex; gap: 10px; justify-content: flex-end; margin-top: 16px; flex-wrap: wrap; }
.toasts { position: fixed; left: 16px; bottom: 96px; z-index: 50; display: flex; flex-direction: column; gap: 6px; pointer-events: none; }
.toast { background: var(--paper-2); border: 1px solid var(--acc); padding: 7px 12px; font-size: 13.5px; max-width: 320px; animation: tin .25s ease-out; }
@keyframes tin { from { transform: translateY(8px); opacity: 0; } }

.ov-grid { display: grid; grid-template-columns: auto 1fr; gap: 4px 14px; font-size: 14px; margin: 8px 0; }
.ov-grid .num { text-align: right; }

@media (max-width: 999px) {
  .main { grid-template-columns: minmax(0, 1fr); }
  .side { position: static; display: none; }
  body.m-lat .side { display: block; }
  body.m-lat #panel { display: none; }
  .tab.mob { display: inline-block; }
  .hero { grid-template-columns: minmax(0, 1fr); gap: 14px; }
  .rail .st .nm { display: none; }
  .ach { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .spire { grid-template-columns: 90px minmax(0, 1fr); }
}
@media (max-width: 560px) {
  .wrap { padding: 0 12px; }
  .logo i { display: none; }
  .bom td, .bom th { padding: 6px 3px; }
  .btn.buy { min-width: 92px; font-size: 13px; }
  .bom td.ds { display: none; }
  .atrack { grid-template-columns: repeat(4, minmax(0, 1fr)); }
  .gate { min-width: 128px; }
  .toasts { bottom: 104px; left: 10px; right: 10px; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}
/* The new eras keep the original drafting-paper visual language. */
:root { --e6:#286b9b; --e7:#955836; --e8:#456a30; --e9:#8750a1; --e10:#9b433e; }
:root[data-theme="dark"] { --e6:#80d5ff; --e7:#ffc48b; --e8:#bdde93; --e9:#daa5ff; --e10:#ffb5a5; }
@media (prefers-color-scheme:dark) { :root:not([data-theme="light"]) { --e6:#80d5ff; --e7:#ffc48b; --e8:#bdde93; --e9:#daa5ff; --e10:#ffb5a5; } }
body[data-era="6"]{--acc:var(--e6)}body[data-era="7"]{--acc:var(--e7)}body[data-era="8"]{--acc:var(--e8)}body[data-era="9"]{--acc:var(--e9)}body[data-era="10"]{--acc:var(--e10)}

const lv = (s, id) => s.up[id] || 0;

/* ---------- derived quantities ---------- */
function resv(s) { return 2 + 0.25 * lv(s, 'res'); }

}
function achMult(s) { return Math.pow(1.08, s.ach.length); }
function tick_(s) { if (s.inPara === 1) return ONE; return O.pow(ocBase(s), s.oc); }

function lamRate(s) { // linear part per second
  if (!hasStar(s, 'l1') || s.inPara === 4 || s.era >= 5) return 0;
  let r = CFG.lamBase;
  if (hasStar(s, 'l2')) r *= 2;
  if (hasStar(s, 'l3')) r *= 3;
  if (hasStar(s, 'm1')) r *= Math.pow(1 + Math.min(4, Math.max(0, lg(s.power.add(10).log10()))), 1.5);
  if (hasStar(s, 'l5')) r *= 4;
  if (hasStar(s, 'l6')) r *= 5;
  r *= Math.pow(1.4, s.para[0]) * Math.pow(1.5, s.para[2]);
  return r;
}
function lamExp(s) { // exponential part (fraction per second)
  if (s.inPara === 4) return 0;
  if (s.era >= 5) return CFG.lamV * Math.pow(1.5, lv(s, 'xl'));
  if (!floorHas(s, 0)) return 0;
  let r = CFG.lamExpBase;
  [2, 5, 8, 11, 13, 15, 17, 19].forEach(i => { if (floorHas(s, i)) r *= 1.5; });
  if (floorHas(s, 18)) r *= Math.pow(1 + Math.min(100, Math.max(0, lg(s.brick.add(1)))), 0.5);
  return r;
}
function lamStart(s) {
  if (s.era >= 5) return Math.pow(3, lv(s, 'x0'));
  let l = 1 + (hasStar(s, 'l4') ? 4 : 0) + 2 * s.para[3];
  if (floorHas(s, 4)) l *= 5;
  if (floorHas(s, 6)) l *= 2;
  if (floorHas(s, 14)) l *= 3;
  l *= Math.pow(3, lv(s, 'x0'));
  return l;
}
function latCtx(s) {
  return {
    lamOn: hasStar(s, 'l1'), lam: s.lam,
    dBonus: s.para[5] - (s.inPara === 5 ? 3 : 0),
    mulPlus: s.inPara === 0, mirror: s.inPara === 2, inv: false, single: s.inPara === 3,
  };
}
function slotVal(lat, i, ctx) { const d = N(Math.max(1, lat.d[i] + ctx.dBonus)); if (lat.lam === i && ctx.lamOn) return ctx.lam.max(d); return d; }
function lineVal(lat, ln, ctx) {
  const vals = ln.sl.map(i => slotVal(lat, i, ctx));
  const ops = ln.op.map(([t, i]) => { let id = lat[t][i]; if (ctx.mulPlus && id === 1) id = 0; return id; });
  if (ctx.mirror) { vals.reverse(); ops.reverse(); }
  return evalSeq(vals, ops, 0, vals.length - 1, ctx.inv);
}
function latKey(lat, ctx) { return lat.n + '|' + lat.d.join() + '|' + lat.h.join() + '|' + lat.v.join() + '|' + lat.lam + '|' + ctx.lamOn + ctx.dBonus + ctx.mulPlus + ctx.mirror + ctx.single; }
function latticeValue(s, lat) {
  lat = lat || s.lat; const ctx = latCtx(s);
  const key = latKey(lat, ctx);
  let c = s._lc;
  if (!c || c.key !== key) {
    const lines = linesFor(lat.n).filter(l => !ctx.single || (l.row && l.i === 0));
    let st = ZERO; const dyn = [];
    for (const ln of lines) { if (ctx.lamOn && lat.lam >= 0 && ln.sl.includes(lat.lam)) dyn.push(ln); else st = st.add(lineVal(lat, ln, ctx)); }

  }
  const lk = ctx.lam.toString();
  if (c.lamKey !== lk) { let v = c.st; for (const ln of c.dyn) v = v.add(lineVal(lat, ln, ctx)); c.val = v; c.lamKey = lk; }

}

function starRate(s) { // ✦ per second

/* ---------- prestige gains ---------- */
/* crystallinity: prestige gains ramp up over the first seconds of a run, so instant re-prestiging is never optimal */
const RT = { crease: 'c', power: 'p', brick: 'b', arrowE: 'a' };
function cryst(s, kind) { const T = CFG.cry[kind] || 0; return T ? Math.min(1, s.rt[RT[kind]] / T) : 1; }

function pendingCrease(s) {
  if (s.star.lt(E25)) return ZERO;
  return s.star.log10().div(CFG.foldDen).pow(CFG.foldPow).mul(creaseMult(s)).floor().max(1);
}
function powerMult(s) {
  let m = 1; if (hasStar(s, 'c1')) m *= 2; if (hasStar(s, 'c2')) m *= 3; if (hasStar(s, 'c3')) m *= 5;
  m *= Math.pow(1.6, s.para[1]) * Math.pow(2, s.para[4]);
  return m;
}
function pendingPower(s) {
  if (s.star.lt(E308) || s.inPara >= 0) return ZERO;
  return s.star.log10().log10().div(CFG.ascDen).pow(CFG.ascPow).mul(powerMult(s) * cryst(s, 'power')).floor().max(1);
}
function brickMult(s) { let m = 1; if (hasStar(s, 't1')) m *= 3; if (floorHas(s, 3)) m *= 2; if (floorHas(s, 7)) m *= 2; if (floorHas(s, 12)) m *= 3; if (floorHas(s, 16)) m *= 3; return m; }
function pendingBrick(s) {
  if (s.star.lt(T5)) return ZERO;
  return s.star.slog().div(5).pow(CFG.towPow).mul(brickMult(s) * cryst(s, 'brick')).floor().max(1);
}
function topArrow(s) { let k = 3; for (let id = 4; id < 12; id++) if (s.own[id] > 0) k = id - 1; return k; }
function arrowMult(s) { return Math.pow(2, lv(s, 'xg')); }
function pendingArrow(s) {
  if (s.star.lt(P3)) return ZERO;
  const k = topArrow(s), h = Math.min(1e16, H(s.star, k));

}

/* ---------- purchases ---------- */
function curOf(s, c) { return s[c]; }
function canBuyUp(s, id) { const u = UP[id], l = lv(s, id); if (l >= u.cap) return false; if (u.req && !u.req(s)) return false; return s[u.cur].gte(u.cost(l)); }
function buyUp(s, id) {
  if (!canBuyUp(s, id)) return false; const u = UP[id], l = lv(s, id);
  s[u.cur] = s[u.cur].sub(u.cost(l)); s.up[id] = l + 1;
  if (u.tile) s.own[u.tile]++;
  if (id === 'grid3') s.lat = resizeLattice(s.lat, 3);
  s._dirty = true; return true;
}
function buyEngine(s, k, max) {
  let bought = 0;
  while (s.eng[k].b < CFG.eng.cap) {
    const b = s.eng[k].b, c = engCost(s, k, b);
    if (s.star.lt(c)) break;
    const left = 10 - (b % 10);
    let n = Math.min(left, CFG.eng.cap - b, Math.floor(num(s.star.div(c))) || 0);
    if (!max) n = 1; if (n <= 0) break;
    s.star = s.star.sub(c.mul(n)).max(0); s.eng[k].b += n; s.eng[k].a = s.eng[k].a.add(n); bought += n;
    if (!max || n < left) break;
  }
  return bought;
}

  const capCost = engCost(s, k, CFG.eng.cap - 1);
  if (s.eng[k].b < CFG.eng.cap && s.star.gte(capCost.mul(1e6))) { const d = CFG.eng.cap - s.eng[k].b; s.eng[k].b = CFG.eng.cap; s.eng[k].a = s.eng[k].a.add(d); return d; }
  return buyEngine(s, k, true);
}
function buyOc(s, max) {
  let n = 0;
  if (s.oc < CFG.oc.cap && s.star.gte(ocCost({ oc: CFG.oc.cap - 1 }).mul(1e6))) { n = CFG.oc.cap - s.oc; s.oc = CFG.oc.cap; return n; }
  while (s.oc < CFG.oc.cap && s.star.gte(ocCost(s))) { s.star = s.star.sub(ocCost(s)); s.oc++; n++; if (!max) break; }
  return n;
}
function buyAllEngines(s) { let n = 0; for (let k = 7; k >= 0; k--) n += buyEngineFast(s, k); return n; }
function digitCost(d) { return p10((d - 1) * Math.log10(2.5)).ceil(); }
function buyDigit(s, i) {
  const d = s.lat.d[i]; if (d >= digitCap(s)) return false;
  const c = digitCost(d); if (s.crease.lt(c)) return false;
  s.crease = s.crease.sub(c); s.lat.d[i]++; s._dirty = true; return true;
}
function buyDigitsCheapest(s, limit = 1e4) {
  let n = 0;
  while (n < limit) {
    let bi = -1, bd = 99;
    s.lat.d.forEach((d, i) => { if (d < digitCap(s) && d < bd) { bd = d; bi = i; } });
    if (bi < 0 || !buyDigit(s, bi)) break; n++;

}
function starAvail(s, id) { const st = STAR[id]; return !hasStar(s, id) && st.req.every(r => hasStar(s, r)); }
function buyStar(s, id) {

  if(forceFallback||typeof Worker==='undefined'||typeof Blob==='undefined'){fallback();return;}let url;
  try{const source='const K=('+K.kernelSource+')();const make='+generator.toString().replaceAll('K.','K.')+';onmessage=e=>{try{const g=make(e.data.kind,e.data.data);let r,n=0;do{r=g.next();if(!r.done&&++n%64===0)postMessage({progress:r.value});}while(!r.done);postMessage({result:r.value});}catch(e){postMessage({error:e.message})}}';url=URL.createObjectURL(new Blob([source],{type:'text/javascript'}));worker=new Worker(url);URL.revokeObjectURL(url);mode='Web Worker';worker.onmessage=e=>{if(id!==serial)return;if(e.data.progress)progress(e.data.progress);else if(e.data.error)fail(Error(e.data.error));else done(e.data.result);};worker.onerror=e=>{e.preventDefault();if(id!==serial)return;worker.terminate();worker=null;fallback();};worker.postMessage({kind,data});}catch(e){if(url)URL.revokeObjectURL(url);if(worker){worker.terminate();worker=null;}fallback();}
});}

<script>
(function () {
'use strict';
const H = window.HT, N = H.N, fmt = x => H.format(x, S?.ui.notation || 'math'), fn = H.fmtNum;
const KEY = 'hypertower.v5';
const $ = id => document.getElementById(id);
const esc = t => String(t).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const SUPD = '⁰¹²³⁴⁵⁶⁷⁸⁹', sup = n => String(n).split('').map(d => SUPD[+d]).join('');
const CN = ['一', '二', '三', '四', '五', '六', '七', '八'];
const CUR = { crease: ['◇', '折痕'], power: ['◆', '幂晶'], brick: ['▲', '塔砖'], arrowE: ['✧', '箭能'] };
const ERAS = [null, ['I', '引擎'], ['II', '折叠'], ['III', '升幂'], ['IV', '塔化'], ['V', '超越']];
const clamp = x => Math.max(0, Math.min(1, isFinite(x) ? x : 0));
const hms = t => { t = Math.floor(t); const h = Math.floor(t / 3600), m = Math.floor(t / 60) % 60, s = t % 60; return h ? `${h} 小时 ${m} 分` : m ? `${m} 分 ${s} 秒` : `${s} 秒`; };
let S = null;
const V = { tab: 'eng', sel: -1, psig: '', lsig: '', tsig: '', gsig: '', rsig: '', pop: null, star: null, tier: '', lastSave: Date.now(), lastCloud: 0, cloud: null, cloudMsg: '', saveMsg: '', achT: 0, autoT: 0, logN: 0, lineT: 0, lines: {}, busy: false, rT: 0 };

/* ---------- saves ---------- */
function loadLocal() { try { const t = localStorage.getItem(KEY) || localStorage.getItem('hypertower.v4') || localStorage.getItem('hypertower.v3'); if (t) return H.load(t); } catch (e) { console.warn('load failed', e); } return null; }
function saveLocal(manual) {
  S.saved = Date.now();
  try { localStorage.setItem(KEY, H.save(S)); V.saveMsg = manual ? '已保存' : ''; } catch (e) { V.saveMsg = '本地存档不可用'; }
  V.lastSave = Date.now();
}
async function initCloud() {
  try {
    if (!window.claude || typeof window.claude.use !== 'function') return;
    const [db, user] = await Promise.all([window.claude.use('db'), window.claude.use('user')]);
    if (!db || !user) return;
    const id = await user.id(); if (!id) return;
    V.cloud = db.doc('data/users/' + id + '/save');
    V.cloudMsg = '云存档已连接';
    const snap = await V.cloud.get();
    if (snap.exists) { const d = snap.data(); if (d && d.s && d.t > (S.saved || 0) + 20000) offerCloud(d); }
  } catch (e) { V.cloud = null; V.cloudMsg = ''; }
}
async function saveCloud() {
  if (!V.cloud) return; V.lastCloud = Date.now();
  try { await V.cloud.set({ t: Date.now(), s: H.exportStr(S), era: S.era }); V.cloudMsg = '云存档已同步'; }
  catch (e) { V.cloudMsg = '云存档暂时无法写入'; }
}
function offerCloud(d) {
  modal(`<div class="era-mark">云存档</div><h3>云端有一份更新的存档</h3><p>那份存档保存于 ${new Date(d.t).toLocaleString()}，进度在第 ${ERAS[d.era || 1][0]} 纪元。载入它会替换这台设备上的进度。</p>
  <div class="act"><button class="btn" data-act="close">保留本地进度</button><button class="btn solid" data-act="cloudLoad">载入云存档</button></div>`);
  V.cloudData = d;
}

/* ---------- number typesetting ---------- */
function heroHTML(x) {
  const sh = H.shape(x);
  if (sh.t === 'plain') return sh.s;
  if (sh.t === 'sci') return `${sh.m}<span class="x">×</span>10<sup>${sh.e}</sup>`;
  if (sh.t === 'tower') { let inner = ''; for (let i = sh.exps.length - 1; i >= 0; i--) inner = `<sup>${sh.exps[i]}${inner}</sup>`; return '10' + inner; }
  const ar = sh.k <= 4 ? '↑'.repeat(sh.k) : `↑<sup>${sh.k}</sup>`;
  return `10<span class="arr">${ar}</span>${sh.h}`;
}
function tierOf(x) { const sh = H.shape(x); return sh.t + (sh.k || (sh.exps ? sh.exps.length : '')); }
function reading(x) {
  const sh = H.shape(x);
  if (sh.t === 'plain') return '';
  if (sh.t === 'sci') return `一个 ${(+sh.e.replace(/,/g, '') + 1).toLocaleString()} 位数`;
  if (sh.t === 'tower') return sh.exps.length === 1 ? `10 的 ${sh.exps[0]} 次方：一个约 ${sh.exps[0]} 位的数` : `${sh.exps.length + 1} 层的幂塔：10 的 10 的……次方，塔顶是 ${sh.exps[sh.exps.length - 1]}`;
  if (sh.k === 2) return `迭幂：一座 ${sh.h} 层高的 10 的幂塔`;
  const name = sh.k === 3 ? '五元运算' : `${sh.k + 2} 元运算`;
  return `${name}（${sh.k <= 4 ? '↑'.repeat(sh.k) : '↑' + sup(sh.k)}）：在这一层上叠了 ${sh.h} 次`;
}
const opSym = id => id === 0 ? '+' : H.OPS[id];
function short(x) { const s = fmt(x); return s; }

/* ---------- milestone ---------- */
function milestone() {
  const s = S;
  if (s.won) return ['Ω 已抵达。星尘仍在无尽模式中增长', 1];
  if (s.foldN === 0) return ['下一站：折叠，需要 ✦ 1e25', clamp(H.lg(s.star) / 25)];
  if (s.era === 2) return ['下一站：升幂，需要 ✦ 2^1024 ≈ 1.80e308', clamp(H.lg(s.star) / 308.25)];
  if (s.era === 3) return ['下一站：塔化，需要 ✦ 10↑↑5', clamp((H.H(s.star, 2) - 2.396) / 2.604)];
  if (s.era === 4) return ['下一站：超越，需要 ✦ 10↑↑↑3', clamp((H.H(s.star, 3) - 1.7) / 1.3)];
  const k = H.topArrow(s), h = Math.min(1e16, H.H(s.star, k));
  return ['终点：Ω = 10{10}10，需要 ↑¹⁰', clamp((k - 3 + Math.min(1, Math.log10(Math.max(1, h)) / 16)) / 7)];
}

/* ---------- small DOM helpers ---------- */
function applyVals(root, vals, ens) {
  root.querySelectorAll('[data-k]').forEach(n => { const v = vals[n.dataset.k]; if (v !== undefined && n._v !== v) { n._v = v; if ('h' in n.dataset) n.innerHTML = v; else n.textContent = v; } });
  if (ens) root.querySelectorAll('[data-en]').forEach(n => { const e = !!ens[n.dataset.en]; if (n._e !== e) { n._e = e; n.classList.toggle('can', e); n.setAttribute('aria-disabled', e ? 'false' : 'true'); } });
}
function toast(msg) { const t = document.createElement('div'); t.className = 'toast'; t.textContent = msg; $('toasts').appendChild(t); setTimeout(() => t.remove(), 4200); }
function modal(html) { $('modalBox').innerHTML = html; $('modal').hidden = false; const b = $('modalBox').querySelector('button.solid, button'); if (b) b.focus(); }
function closeModal() { $('modal').hidden = true; $('modalBox').innerHTML = ''; }
function confirmModal(title, body, ok, fn_) { V.confirmFn = fn_; modal(`<h3>${title}</h3><p>${body}</p><div class="act"><button class="btn" data-act="close">取消</button><button class="btn solid" data-act="confirmOk">${ok}</button></div>`); }
function flashHero() { const r = $('heroRule'); r.classList.remove('go'); void r.offsetWidth; r.classList.add('go'); }
function upRow(id) {
  const u = H.UP[id];
  return `<tr><td class="nm">${u.name}</td><td class="ds" data-k="d_${id}"></td><td class="lv" data-k="l_${id}"></td><td class="r"><button class="btn buy" data-act="up" data-id="${id}" data-en="e_${id}"><span data-k="c_${id}"></span></button></td></tr>`;
}
function upVals(ids, v, e) {
  for (const id of ids) {
    const u = H.UP[id], l = H.lv(S, id);
    v['d_' + id] = u.desc(S); v['l_' + id] = l + ' / ' + u.cap;
    v['c_' + id] = l >= u.cap ? '已满' : fmt(u.cost(l)) + ' ' + CUR[u.cur][0];
    e['e_' + id] = H.canBuyUp(S, id);
  }
}
function tog(path, label, on) { return `<label class="tog"><input type="checkbox" data-set="${path}" ${on ? 'checked' : ''}> ${label}</label>`; }
function ratioInput(path, val) { return `<label class="tog">收益倍数 <input class="txt" style="width:6em" data-set="${path}" data-num value="${esc(fn(val))}"></label>`; }

/* ---------- intros ---------- */
const INTRO = {
  0: ['欢迎', '欢迎来到箭塔', ['目标：从第一缕星尘出发，越过 Ω 与 ε 序列，在第 XI 纪元设计一条属于自己的九头蛇。', '先买一台一阶引擎。每一阶引擎都会生产下一阶，星尘会越滚越快。', '进度会自动保存。关掉页面后游戏继续运转，回来时补算离线收益，最多 24 小时。']],
  2: ['第 II 纪元', '折叠与算式晶格', ['折叠会重置星尘、引擎和超频，换来折痕 ◇。', '折痕用来建造算式晶格。每一行、每一列都是一道算式，它们的总和 L 让星尘产量 ×(1+L)^φ。空的算符槽当作加号。', '点一个数字格可以升刻度，再点另一格就能互换；点算符槽可以放入乘符 ×。“自动排布”会替你找一个好布局。']],
  3: ['第 III 纪元', '升幂与幂塔', ['星尘溢出 2^1024 后可以升幂：重置折痕与 λ，换来幂晶 ◆，用来点亮星图。', '幂符 ^ 是右结合的：9^9^9 = 9^(9^9)，一个有 3.7 亿位的数。同一行里幂符越多，幂塔越高。', '星图中的递归核 λ 是一块持续增长的数字砖。它附着在一个数字格上，取两者中较大的值，放在幂塔最顶端效果最好。', '升幂收益要结晶大约 30 秒，刚开局时只能拿到一部分。']],
  4: ['第 IV 纪元', '塔化与迭幂', ['星尘达到 10↑↑5，也就是五层 10 的幂塔之后，可以塔化：换来塔砖 ▲，并得到一块迭幂符 ↑↑。', 'a↑↑b 是 b 个 a 叠成的幂塔。把 λ 放在 ↑↑ 的右边，λ 就是塔的层数。', '尖塔的楼层会让 λ 改为指数增长。第 21 层再给你一块 ↑↑，可以叠出 a↑↑b↑↑λ。']],
  5: ['第 V 纪元', '超越与箭阵', ['星尘达到 10↑↑↑3 后可以超越，得到五元运算符 ↑↑↑ 和箭能 ✧。', 'λ 被重铸为箭核：每局从 1 开始指数增长，之前的 λ 加成不再生效。', '用箭能依次解锁 ↑⁴ 到 ↑¹⁰。箭能取决于你拥有的最高箭头，以及星尘在那一层的高度。', 'Ω = 10{10}10 是通往第 VI 纪元的门。到达后打开「超限」，开始第一次坍缩。']],
};

  modal(`<div class="era-mark">${it[0]}</div><h3>${it[1]}</h3>${it[2].map(p => `<p>${p}</p>`).join('')}<div class="act"><button class="btn solid" data-act="close">开始</button></div>`);

/* ---------- tabs ---------- */
const TABS = [
  ['eng', '引擎', () => true], ['lat', '晶格', () => S.foldN > 0, true], ['fold', '折叠', () => S.foldN > 0],
  ['star', '星图', () => S.era >= 3], ['para', '悖论', () => H.hasStar(S, 'p1')], ['spire', '尖塔', () => S.era >= 4],

/* ---------- panels ---------- */
const P = {};
const visEng = () => { let k = 1; while (k < 8 && S.eng[k - 1].b > 0) k++; return k; };
P.eng = {
  sig: () => [visEng(), H.lv(S, 'autoE'), H.lv(S, 'autoO'), S.inPara === 1].join(),

    <div class="tblwrap"><table class="bom"><thead><tr><th>型号</th><th>数量</th><th class="r">倍率</th><th class="r">买 1 台</th><th class="r">买满 10</th></tr></thead><tbody>`;

      r += `<tr class="${off ? 'off' : ''}"><td class="nm">${CN[k]}阶引擎</td><td class="amt" data-k="ea${k}"></td><td class="lv" data-k="em${k}"></td>

      <td class="r"><button class="btn buy" data-act="engM" data-i="${k}" data-en="eM${k}"><span data-k="eM${k}"></span></button></td></tr>`;
    }

      <td class="r"><button class="btn buy" data-act="oc1" data-en="oc1"><span data-k="occ"></span></button></td><td class="r"><button class="btn buy" data-act="ocM" data-en="oc1">全部</button></td></tr>`;

      ${H.lv(S, 'autoE') ? tog('auto.eng', '自动购买引擎', S.auto.eng) : ''}${H.lv(S, 'autoO') ? tog('auto.oc', '自动超频', S.auto.oc) : ''}</div></div>`;

/* ---------- offline ---------- */
function offline(sec, done) {
  V.busy = true; sec = Math.min(sec, 86400);
  const steps = Math.min(900, Math.max(30, Math.ceil(sec / 2))), dt = sec / steps;
  const b = { star: S.star, crease: S.crease, power: S.power, brick: S.brick, arrowE: S.arrowE, era: S.era, folds: S.foldN, asc: S.ascN, tow: S.towN };
  modal(`<div class="era-mark">离线收益</div><h3>正在补算你离开的 ${hms(sec)}</h3><div class="goal"><div class="bar"><i id="offBar"></i></div></div>`);
  let i = 0;
  const chunk = () => {
    const end = Math.min(steps, i + 20);
    for (; i < end; i++) { H.tick(S, dt); H.automate(S); H.autoPrestige(S); }
    const bar = $('offBar'); if (bar) bar.style.width = (i / steps * 100) + '%';
    if (i < steps) { setTimeout(chunk, 0); return; }
    S.last = Date.now(); V.busy = false;
    const rows = [['星尘 ✦', fmt(b.star) + ' → ' + fmt(S.star)]];
    for (const [k, nm] of [['crease', '折痕 ◇'], ['power', '幂晶 ◆'], ['brick', '塔砖 ▲'], ['arrowE', '箭能 ✧']]) if (!S[k].eq(b[k])) rows.push([nm, fmt(b[k]) + ' → ' + fmt(S[k])]);
    if (S.foldN > b.folds) rows.push(['折叠', '+' + (S.foldN - b.folds) + ' 次']);
    if (S.ascN > b.asc) rows.push(['升幂', '+' + (S.ascN - b.asc) + ' 次']);
    if (S.towN > b.tow) rows.push(['塔化', '+' + (S.towN - b.tow) + ' 次']);
    modal(`<div class="era-mark">离线收益</div><h3>你离开了 ${hms(sec)}</h3><div class="ov-grid">${rows.map(r => `<span class="muted">${r[0]}</span><span class="num">${r[1]}</span>`).join('')}</div><div class="act"><button class="btn solid" data-act="close">好的</button></div>`);
    afterChange(); if (done) done();
  };
  chunk();
}

/* ---------- loop ---------- */
function step() {
  if (V.busy || !S) return;
  const now = Date.now(); let dt = (now - S.last) / 1000; S.last = now;
  if (dt > 60) { offline(dt); return; }
  if (dt > 0) { const n = Math.min(240, Math.ceil(dt / 0.25)), sdt = dt / n; for (let i = 0; i < n; i++) H.tick(S, sdt); }
  if (now - V.autoT > 100) { V.autoT = now; const era = S.era; H.automate(S); H.autoPrestige(S); if (S._dirty) S._dirty = false; if (S.era !== era) afterChange(); }
  if (now - V.achT > 1000) { V.achT = now; events(); }
  if (now - V.lastSave > 15000) saveLocal(false);
  if (V.cloud && now - V.lastCloud > 120000) saveCloud();
}
function frame() { const now = performance.now(); if (now - V.rT > 90 && S && !V.busy) { V.rT = now; try { render(); } catch (e) { console.error(e); } } requestAnimationFrame(frame); }
document.addEventListener('visibilitychange', () => { if (document.hidden && S) saveLocal(false); });

function xiTreeSVG(tree){
  if(!tree.length)return '<div class="xi-dead"><span>✓</span><b>蛇已死亡</b><small>提交斩法，把这个解变成永久蓝图。</small></div>';
  function group(t,p=[]){const map=new Map();t.forEach((c,i)=>{const k=D11.key(c);if(map.has(k))map.get(k).copies++;else map.set(k,{t:c,p:p.concat(i),copies:1});});return [...map.values()].map(v=>({...v,children:group(v.t,v.p)}));}
  function width(v){v.w=v.children.length?v.children.reduce((n,c)=>n+width(c),0):1;return v.w;}
  const root={p:[],copies:1,children:group(tree)};width(root);const w=Math.max(300,root.w*48+48);let maxY=0,paths='',nodes='';
  function draw(v,left,depth,parent){const xx=(w-root.w*48)/2+(left+v.w/2)*48,yy=24+depth*42;maxY=Math.max(maxY,yy);
    if(parent)paths+=`<path d="M${parent[0]} ${parent[1]} L${xx} ${yy}"/>`;
    const leaf=v.children.length===0&&v.p.length>0,path=v.p.join('.');nodes+=`<g class="${leaf?'head':'joint'}" ${leaf?`data-act="xcut" data-path="${path}" role="button" tabindex="0" aria-label="斩第 ${v.p.map(n=>n+1).join('·')} 枝的头"`:''}><circle class="hit" cx="${xx}" cy="${yy}" r="15"/><circle cx="${xx}" cy="${yy}" r="${leaf?7:4}"/>${v.copies>1?`<text x="${xx+11}" y="${yy-8}" class="copies">×${v.copies}</text>`:''}</g>`;
    let l=left;for(const c of v.children){draw(c,l,depth+1,[xx,yy]);l+=c.w;}
  }draw(root,0,0,null);
  const viewW=Math.max(300,root.w*48+48),h=Math.max(130,maxY+30);
  return `<div class="xi-tree-scroll"><svg class="xi-tree" width="${viewW}" height="${h}" viewBox="0 0 ${viewW} ${h}" role="group" aria-label="九头蛇有根树，红色叶片可以斩击"><g class="branches">${paths}</g>${nodes}</svg></div>`;
}

function forestSVG(t,width=145,height=110){let next=0,maxDepth=1,nodes=[],edges='';function layout(t,depth,parent){const id=nodes.length;nodes.push({t,depth,x:0});maxDepth=Math.max(maxDepth,depth);const children=t.ch.map(c=>layout(c,depth+1,id));nodes[id].x=children.length?children.reduce((n,k)=>n+nodes[k].x,0)/children.length:++next;if(parent!==undefined)edges+=`<path data-from="${parent}" data-to="${id}"/>`;return id;}layout(t,1);const pos=n=>[(n.x/(next+1))*width,n.depth/(maxDepth+1)*height];return `<svg class="late-tree" width="${width}" height="${height}" viewBox="0 0 ${width} ${height}" aria-label="带颜色的有根树">${[...edges.matchAll(/data-from="(\d+)" data-to="(\d+)"/g)].map(m=>{const a=pos(nodes[+m[1]]),b=pos(nodes[+m[2]]);return `<path d="M${a.join(' ')} L${b.join(' ')}"/>`;}).join('')}${nodes.map(n=>{const[x,y]=pos(n);return `<circle cx="${x}" cy="${y}" r="5" class="color-${n.t.c%3}"/>`;}).join('')}</svg>`;}

ACT.ltagcut=()=>xiTry(()=>{if(!ls().tagged.ch.length)throw Error('实验树已经没有头了');let p=[],v=ls().tagged;while(v.ch.length){p.push(v.ch.length-1);v=v.ch.at(-1);}const t=LK.taggedCut(ls().tagged,p,ls().tagCuts+1);ls().tagged=t||LK.leaf(0);ls().tagCuts++;ls().revision++;afterChange();});

async function lateJob(kind,data,apply){const sid=++lateJobSerial,save=S,era=S.era,a=ls();lateStatus='计算中…';lateReport=null;afterChange();try{const r=await H.LateJobs.run(kind,data,p=>{if(sid===lateJobSerial){lateStatus='计算中 · '+Object.entries(p).map(([k,v])=>k+' '+v).join(' / ');afterChange();}});if(r.cancelled||sid!==lateJobSerial||save!==S||S.era!==era)return;lateReport=r.result.report||r.result;lateStatus=(lateReport.summary||'设计已生成')+' · '+r.mode+' · '+r.ms.toFixed(1)+' ms';if(apply)apply(r.result,a);a.revision++;afterChange();}catch(e){if(sid===lateJobSerial){lateStatus=e.message;afterChange();}}}
ACT.lsolve=()=>xiTry(()=>{if(!L.choice(S))throw Error('AC 关闭时请加载已保存的指定蓝图');lateSnapshot();lateJob('solve',{era:S.era,puzzle:ls().puzzle,options:L.options(S.era,ls().challenge)},(r,a)=>{if(!r.report.valid)throw Error('当前限制下没有可用的参考解；可换一道题');a.design=r.design;a.aided=true;lateStatus='参考设计已载入 · '+r.report.summary;});});
ACT.lverify=()=>{lateJob('evaluate',{era:S.era,puzzle:ls().puzzle,design:LK.clone(ls().design),options:L.options(S.era,ls().challenge)},r=>{lateStatus=(r.valid?'验证通过，可以提交蓝图。':'尚未达到目标。')+' '+r.summary;});};
ACT.llife=()=>xiTry(()=>{const steps=Number($('lateGenerations').value);lateJob('life',{design:{...LK.clone(ls().design),steps},options:L.options(15,ls().challenge)});});
ACT.lsoup=()=>xiTry(()=>{if(!L.choice(S))throw Error('AC 关闭时不自动挑选最佳汤');const seed=++ls().solverSeed;lateJob('soup',{seed,tries:8,steps:100},r=>{lateStatus='汤搜索保留一个实验种子：'+r.report.summary+'（未替换生产蓝图）';});});
ACT.lmachine=()=>xiTry(()=>{const design={machine:LK.clone(ls().design.machine),budget:Number($('lateMachineBudget').value)};lateJob('machine',{design},(r,a)=>{if(!r.halted){const key=JSON.stringify(design.machine);if(!a.pool.some(m=>JSON.stringify(m)===key)&&a.pool.length<128)a.pool.push(design.machine);}else{a.records['bb'+design.machine.states]={steps:r.steps,ones:r.ones};}});});
ACT.lclassify=()=>{const d=LK.clone(ls().design);if(ls().challenge===0)d.modules=d.modules.filter(m=>m!=='cycle');if(ls().challenge===2)d.budget=Math.max(1,Math.floor(d.budget/10));lateJob('classify',{design:d},r=>{lateStatus=r.summary+' · 状态 '+r.status+' · 计算成本 '+r.cost.toFixed(2);});};
ACT.lpool=()=>{const a=ls(),pool=S.eras['16']?.pool||[];a.pool=LK.clone(pool);toast('载入 '+pool.length+' 台未判定机器');afterChange();};
ACT.lsubmit=()=>xiTry(()=>{const r=L.submit(S,$('lateBlueprintName')?.value);if(S.era===17&&ls().certificates.length<64){const d=ls().design;ls().certificates.push({machine:LK.clone(d.machine),...d.certificate});}lateStatus='已重新验算并提交 · '+r.stars+' 星 · '+r.report.summary;afterChange();saveLocal(false);toast('蓝图已开始生产');});
ACT.lcancel=()=>{lateCancel();afterChange();};
ACT.ltrial=d=>{if(L.trial(S,+d.i)){lateCancel();ls().revision++;afterChange();}};ACT.lexittrial=()=>{ls().challenge=-1;ls().revision++;afterChange();};
ACT.laddrule=()=>xiTry(()=>{H.Workshop.add(S,{era:S.era,sensor:$('lateSensor').value,value:Number($('lateThreshold').value),action:$('lateAction').value,upgrade:Number($('lateUpgrade').value),blueprint:$('lateRuleBlueprint').value,group:Number($('lateGroup').value),cooldown:Number($('lateCooldown').value)});afterChange();});
ACT.lrulestarter=()=>xiTry(()=>{if(S.workshop.rules.length+3>H.Workshop.slots(S))throw Error('需要三个空卡槽');for(const r of [{sensor:'age',value:1,action:'buyFixed',upgrade:5,group:0},{sensor:'ready',value:1,action:'diagonal',group:1},{sensor:'age',value:60,action:'next',group:2}])H.Workshop.add(S,{...r,era:S.era,cooldown:1});afterChange();});
ACT.lbpload=d=>{L.activate(S,d.id);afterChange();};ACT.lbpsandbox=d=>{const b=H.Blueprint.get(S,d.id);if(b?.era!==S.era)return;lateSnapshot();ls().puzzle=b.payload.puzzle;ls().design=LK.clone(b.payload.design);ls().aided=b.source==='solver';ls().revision++;afterChange();if(window.innerWidth<1000)V.tab='lat';};
ACT.lbpdelete=d=>{const i=S.blueprints.findIndex(b=>b.id===d.id);if(i<0)return;S.blueprints.splice(i,1);if(ls().active===d.id)ls().active=S.blueprints.find(b=>b.era===S.era)?.id||'';afterChange();};
ACT.lnormalize=()=>{if(!L.canNormalize(S))return;confirmModal('归一，开始下一轮？','保留谜题纪录、蓝图库、规则卡、成就和封存遗产；本轮研究与资源重新开始。','归一',()=>xiTry(()=>{L.normalize(S);lateCancel();lateUndo=[];resetView();V.tab='eng';lateChanged();saveLocal(true);}));};
document.addEventListener('change',e=>{if(!lateOn())return;const t=e.target;xiTry(()=>{if(t.dataset.lauto){ls().auto[t.dataset.lauto]=t.checked;ls().revision++;}if(t.hasAttribute('data-lfeedback'))lateEdit(d=>d.feedback=Number(t.value));if(t.dataset.ltransition!==undefined)lateEdit(d=>{const index=+t.dataset.ltransition,previous=d.machine.table[index];d.machine.table[index]=t.value.toUpperCase();try{LK.machineCheck(d.machine);}catch(e){d.machine.table[index]=previous;throw e;}});if(t.dataset.lcertificate)lateEdit(d=>d.certificate[t.dataset.lcertificate]=Number(t.value));if(t.dataset.lprop)lateEdit(d=>{const k=d.selected.indexOf(t.dataset.lprop);if(t.checked&&k<0)d.selected.push(t.dataset.lprop);else if(!t.checked&&k>=0)d.selected.splice(k,1);});if(t.dataset.lreflect!==undefined)lateEdit(d=>d.slots[+t.dataset.lreflect]=Number(t.value));if(t.hasAttribute('data-lcritical'))lateEdit(d=>d.critical=Number(t.value));if(t.hasAttribute('data-lchoice')){L.setChoice(S,t.checked);afterChange();}if(t.dataset.lcarry)lateEdit(d=>{const v=t.dataset.lcarry,k=d.carry.indexOf(v);if(t.checked&&k<0){if(d.carry.length>=3)throw Error('遗产最多三项');d.carry.push(v);}else if(k>=0)d.carry.splice(k,1);});if(t.hasAttribute('data-lworkshop'))S.workshop.enabled=t.checked;if(t.hasAttribute('data-lroundauto'))S.legacy.auto=t.checked;afterChange();});});
const lateOldOffline=offline;
offline=function(sec,done){if(!lateOn()&&!S.legacy?.rebuilding&&!S.legacy?.auto)return lateOldOffline(sec,done);const seconds=Math.min(86400,Math.max(0,sec)),before={era:S.era,index:S.ord?.index,round:S.legacy.round,funds:lateOn()?ls().funds:0},start=performance.now();V.busy=true;try{H.tick(S,seconds);S.last=Date.now();V.busy=false;lateChanged();saveLocal(false);modal(`<div class="era-mark">离线收益 · 已验蓝图</div><h3>证明，继续产生回响。</h3><div class="ov-grid"><span>离线时长</span><span>${hms(seconds)}</span><span>纪元</span><span>${before.era} → ${S.era}</span><span>归一轮数</span><span>${before.round} → ${S.legacy.round}</span><span>补算用时</span><span>${(performance.now()-start).toFixed(1)} ms</span></div><p>按齿轮、研究购买和规则冷却事件解析补算。新搜索不在离线时运行；产出只来自已验证的蓝图。</p><div class="act"><button class="btn solid" data-act="close">继续</button></div>`);if(done)done();}catch(e){V.busy=false;toast('离线补算失败：'+e.message);if(done)done();}};
const lateOldResetView=resetView;
resetView=function(){lateCancel();lateUndo=[];lateTree=LK.leaf(0);lateOldResetView();if(lateOn())V.tab='hydra';};
const lateOldOptions=P.opt.html;
P.opt.html=()=>lateOldOptions().replace(/<div class="frame"><span class="ft">v5\.0 · 九头纪<\/span>[\s\S]*$/,'')+`<div class="frame"><span class="ft">v6.0 · 绝对纪</span><p class="p">I–XX 已接通：九个新纪元、216 道参数化验证题、六项研究与十二层挑战/纪元、离线生产、选择公理和遗产轮回。兼容 HT3、HT4、HT5，继续使用 hypertower.v5 保存位置。</p><p class="p">数学内核的范围见「旧纪元档案」。这是全纪元可玩实现，尚未达到规划中原始 Buchholz 算法、通用 ψ 比较器和完整判定器的研究级目标。</p></div>`;
document.querySelector('.version').textContent='VI · 绝对纪';

function boot() {
  S = loadLocal();
  const fresh = !S;
  if (!S) S = H.newState();
  V.logN = S.log.length; applyTheme();
  const away = (Date.now() - (S.last || Date.now())) / 1000;
  setInterval(step, 50); requestAnimationFrame(frame);
  if (fresh || !S.ui.intro) { S.ui.intro = true; showIntro(0); }
  else if (away > 60) offline(away);
  else S.last = Date.now();
  initCloud();
}
if (!window.OmegaNum || !window.HT) {
  document.getElementById('panel').innerHTML = '<div class="locked">内置运算库未能启动。请重新打开完整的 HTML 文件。</div>';
} else boot();
window.__HT_STATE = () => S;
})();

</script>
